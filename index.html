<template id="tpl-about">
  <div class="win-toolbar">File &nbsp; Edit &nbsp; View &nbsp; Help</div>
  <div class="notepad">
<pre>Hi, I'm Okan Halis.

I'm a UX Designer based in Berlin, originally from Turkey, with about
13 years of experience across industrial design, entrepreneurship, and
design research. Most recently I've been Senior UX Designer at Klang
Games, and before that Lead UX Designer at Vuvy Games.

Before games, I spent five years co-founding Gixal Design Lab, leading
UX research and design across SaaS and e-commerce products — from
user flows all the way to full design systems built around atomic
design principles.

My approach is to actually understand the business model first — how
the value proposition and the product relate — and then use design to
make things work for the people using them. In games specifically,
that shifts a bit — it's less about removing friction and more about
making sure players can get to the fun part without the interface
getting in the way.

These days I'm also leaning into AI-assisted, AI-native ways of
working. This site, for example, was built together with Claude, and
tools like Claude Code are part of how I prototype and ship UX
improvements.</pre>
  </div>
</template>
