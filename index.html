<!-- DESKTOP -->
<main id="desktop">

      <img src="assets/icon-user.svg" alt="">
      <span>Hakkımda</span>

      <img src="assets/icon-folder.svg" alt="">

      <img src="assets/icon-globe.svg" alt="">
      <span>Sosyal.lnk</span>
    </button>
    <button class="icon" data-window="bin">
      <img src="assets/icon-bin.svg" alt="">
      <span>Geri Dönüşüm Kutusu</span>
    </button>
  </div>

  <!-- Windows layer -->
  <div id="windows-layer"></div>

  <!-- Taskbar -->
  <footer id="taskbar">
    <button id="start-btn">
      <img src="assets/icon-flag.svg" alt="">
      <span>Başlat</span>
    </button>
    <div id="task-buttons"></div>
    <div id="tray">
      <span id="clock">00:00</span>
    </div>
  </footer>

  <!-- Start menu -->
  <nav id="start-menu">
    <div class="start-side">OKAN95</div>
    <ul>
      <li data-window="about"><img src="assets/icon-user.svg" alt=""> Hakkımda</li>
      <li data-window="projects"><img src="assets/icon-folder.svg" alt=""> Projeler</li>

      <li data-window="browser"><img src="assets/icon-globe.svg" alt=""> Sosyal.lnk</li>
      <li class="sep"></li>
      <li id="shutdown-item"><img src="assets/icon-power.svg" alt=""> Kapat…</li>
    </ul>
  </nav>

</main>
